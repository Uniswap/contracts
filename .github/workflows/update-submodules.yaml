name: Update Submodules

on:
  workflow_dispatch:
  schedule:
    # Run this workflow hourly at *:17 UTC
    - cron: "17 * * * *"

jobs:
  update-submodules:
    # workflow_dispatch can target any branch, and the push below goes to main; only run from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update Submodules
        run: |
          # Initialize all submodules first
          git submodule update --init src/pkgs

          # Read pinned submodules (if config exists)
          PINNED=""
          if [ -f .pinned-submodules ]; then
            PINNED=$(grep -v '^#' .pinned-submodules | grep -v '^$' || true)
          fi

          # Update each submodule, skipping pinned ones
          for submodule in src/pkgs/*/; do
            submodule="${submodule%/}"  # Remove trailing slash
            if echo "$PINNED" | grep -q "^${submodule}$"; then
              echo "Skipping pinned submodule: $submodule"
            else
              echo "Updating submodule: $submodule"
              git submodule update --remote "$submodule"
            fi
          done

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for Changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=changes present" >> $GITHUB_OUTPUT
          else
            echo "changes=" >> $GITHUB_OUTPUT
          fi

      # The push is authorized by the contracts-briefcase-syncer GitHub App, not a deploy key: a deploy
      # key's pushes are attributed to the person who created it, and the App is a bypass actor on the
      # contracts main ruleset (bypass mode "always", since the ruleset requires pull requests and status
      # checks). The App's slug and installation id are printed before each push.
      # This job signs with its own App private key, separate from update-briefcase.yaml's, so either key
      # can be rotated or revoked without breaking the other job.
      - name: Mint a push token for the contracts repo
        id: contracts-token
        if: steps.git-check.outputs.changes != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BRIEFCASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_PRIVATE_KEY }}
          owner: Uniswap
          repositories: contracts
          permission-contents: write

      - name: Commit and Push if changes are present
        if: steps.git-check.outputs.changes != ''
        env:
          CONTRACTS_TOKEN: ${{ steps.contracts-token.outputs.token }}
          CONTRACTS_APP_SLUG: ${{ steps.contracts-token.outputs.app-slug }}
          CONTRACTS_INSTALLATION_ID: ${{ steps.contracts-token.outputs.installation-id }}
        run: |
          git add .
          git commit -m "Update submodules"
          git pull --rebase origin main
          echo "pushing as ${CONTRACTS_APP_SLUG}[bot] (installation ${CONTRACTS_INSTALLATION_ID})"
          # The token goes on the push command only, so it is never written to .git/config.
          git push "https://x-access-token:${CONTRACTS_TOKEN}@github.com/Uniswap/contracts.git" HEAD:main
